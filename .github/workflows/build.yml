name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential git pkg-config \
            libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev \
            libpipewire-0.3-dev libdecor-0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxt-dev \
            libegl1-mesa-dev libgles2-mesa-dev

      - name: Build SDL3
        run: |
          git clone --depth 1 -b main https://github.com/libsdl-org/SDL.git
          cmake -S SDL -B SDL/build -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build SDL/build --target install
          sudo ldconfig

      - name: Build SDL3_ttf
        run: |
          git clone --depth 1 -b main https://github.com/libsdl-org/SDL_ttf.git
          cmake -S SDL_ttf -B SDL_ttf/build -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build SDL_ttf/build --target install
          sudo ldconfig

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Copy assets
        run: cp -r assets build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LangtonAnts-Linux
          path: |
            build/app
            build/assets

  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          vcpkg install sdl3 sdl3-ttf --triplet x64-windows

      - name: Configure
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release

      - name: Copy SDL DLLs and assets
        run: |
          copy "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\SDL3.dll" build\Release\
          copy "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\SDL3_ttf.dll" build\Release\
          xcopy /E /I assets build\Release\assets

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LangtonAnts-Windows
          path: |
            build/Release/app.exe
            build/Release/SDL3.dll
            build/Release/SDL3_ttf.dll
            build/Release/assets